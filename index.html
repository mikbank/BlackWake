<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#090f18"><title>Blackwake • Free Roam</title></head><body><div id="app">
<canvas id="space" aria-label="Space flight arena. Click or tap to set a destination."></canvas><div class="vignette"></div>
<header class="flight-bar"><button id="inspect" class="hull-button" aria-label="Your hull and ship details"><span class="hull-icon" aria-hidden="true">◇</span><span>Hull <strong id="player-hull-text">100%</strong><span class="hull-track"><i id="player-hull"></i></span></span><span id="hull-warning" hidden>Critical</span></button><button id="system-chart" class="system-badge" aria-label="Open universe map">Ashen Reach ↗</button><button id="pause" class="menu-button" aria-label="Pause and open menu"><span aria-hidden="true">☰</span></button></header>
<main class="flight-hud"><section class="objective"><p id="objective">Free roam · Choose your own course.</p><div id="target-info" class="target-info"><button id="target-title">Contact</button><span id="distance">— m</span><div class="target-meter"><span>Engines</span><div class="track"><i id="enemy-engine"></i></div><b id="enemy-engine-text">100%</b></div><div class="target-meter muted"><span>Hull</span><div class="track"><i id="enemy-hull"></i></div><b id="enemy-hull-text">100%</b></div></div></section>
<div id="toast" role="status"></div><div id="save-warning" role="status" hidden></div><div id="radio-layer" aria-live="polite" aria-relevant="additions"></div>
<div class="world-label" id="enemy-label"><span id="contact-name">Contact</span><small id="enemy-hint">Guild merchant</small></div>
<button id="minimap-button" class="minimap" aria-label="Live minimap. Tap to open sector map." title="Open sector map"><canvas id="minimap" width="192" height="192" aria-hidden="true"></canvas><span>Map ↗</span></button>
<button id="edge-guide" class="edge-guide" hidden><span id="edge-arrow" aria-hidden="true">➜</span><span id="edge-text"></span></button>
<footer class="action-area"><div class="course-row"><span id="course-status"></span><button id="cruise" aria-pressed="false" title="Set a course, then engage cruise. C toggles cruise." disabled><span id="cruise-label">Cruise</span><kbd>C</kbd></button><button id="brake" hidden>Stop <kbd>S</kbd></button></div>
<div id="combat-controls" class="combat-controls"><button id="mode">Target: Engines <span aria-hidden="true">⌄</span></button><div class="battery-status" aria-label="Broadside reload status"><div><span>Port <b id="port-ready">Ready</b></span><div class="track"><i id="port-reload"></i></div></div><div><span>Starboard <b id="starboard-ready">Ready</b></span><div class="track"><i id="starboard-reload"></i></div></div></div></div>
<button id="interact" class="primary contextual" hidden>Interact</button><p id="action-hint">Tap space to set a course.</p></footer></main>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Captain’s menu"><article class="dialog" id="dialog"></article></div></div><script type="module" src="/src/main.ts"></script></body></html>
